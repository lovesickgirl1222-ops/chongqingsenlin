D('Ⅱ-1-가. 한국어 받침 특징','<p>표기상 받침은 27개(홑 14, 겹 11, 쌍 2)지만 실제 발음은 ㄱ ㄴ ㄷ ㄹ ㅁ ㅂ ㅇ 7개입니다. 예: 잎→[입], 낮→[낟].</p><p><b>불파음화</b>: 파열음 종성이 음절 말에서 공기를 터뜨리지 않고 막은 채 끝나는 현상입니다. 빛·빚·빗은 단독으로 모두 [빋]이 되며, 이를 <b>중화</b>라고 합니다.</p><p>비음은 ㅁ ㄴ ㅇ이며, 초성 ㅇ은 음가가 없지만 받침 ㅇ은 음가를 가집니다.</p>')+
D('Ⅱ-1-나. 광둥어 받침 특징','<p>받침은 -p -t -k -m -n -ng 6개입니다. 안울림소리 -p -t -k는 ㅂ ㄷ ㄱ에, 울림소리 -m -n -ng는 ㅁ ㄴ ㅇ에 대응합니다. 보통화와 달리 입성과 -m을 그대로 간직해 한자음과 비슷한 부분이 많고, 입성은 한국어 파열음처럼 불파음 특성을 보입니다. -m과 -ng는 모음 없이 한 음절을 이루기도 합니다(唔 m4, 吳 ng4).</p>')+
D('Ⅱ-1-다. 3단 비교 (國·三·一)','<div class=scroll><table><tr><th>한자</th><th>한국어</th><th>광둥어</th><th>보통화</th></tr><tr><td>國</td><td>국</td><td>궉 kwok</td><td>궈 guo</td></tr><tr><td>三</td><td>삼</td><td>쌈 saam</td><td>싼 san</td></tr><tr><td>一</td><td>일</td><td>얏 jat</td><td>이 yi</td></tr></table></div><p>國: 한국어·광둥어는 입성 -k를 유지, 보통화는 받침 소실. 三: -m 유지, 보통화는 -n. 一: 광둥어는 -t를 유지하나 한국 한자음 발달 과정에서 ㄹ(일)로 변했습니다.</p>')+
D('Ⅱ-2. 대사 속 받침 분석','<p><b>입성(ㄱ)</b>: 記憶(게 익)·肉(육)·國(궉)은 모두 불파음. <b>비음 ㅁ</b>: 三(쌈)=삼. <b>비음 ㄴ·ㅇ</b>: 萬(만)·年(닌)·保鮮(보선) 등에서 구조가 일치. 唔(m4)처럼 광둥어에는 모음 없는 성절 비음이 있지만 한국어는 초성·중성·종성 구조가 필요합니다.</p><p><b>초성·음절 구조</b>: jyutping의 j는 반모음 [j]라서 jik은 [익]처럼 들립니다. 我(ngo5)의 초성 ng는 음가가 있지만 한국어 초성 ㅇ은 음가가 없습니다.</p><p class=mut>→ 대사 전체는 ‘대사 분석’ 탭에서 확인하세요.</p>')+
D('Ⅲ. 결론 및 한계, 느낀점','<p><b>결론</b>: 한국어 6개 받침이 광둥어 6개 받침과 대응하고, 보통화는 입성이 소멸해 비음 2개만 남은 반면 광둥어와 한국어는 입성·비음 받침을 유지해 긴밀성이 높습니다. 一(jat1)은 -t가 ㄹ로 변한 사례입니다.</p><p><b>한계</b>: 국내에는 보통화 자료가 대부분이라 광둥어 자료 조사가 어려웠고, ‘장국영의 언어’는 발음 설명이 추상적이었습니다. 영화 대사만 분석해 광둥어 전반의 음운 변동을 일반화하기엔 한계가 있습니다. 앞으로 다양한 대화 데이터를 수집해 범위를 넓힐 계획입니다.</p><p><b>느낀점</b>: 아쉬움을 해소한 뜻깊은 탐구였고, 이후 쓰촨화 탐구에 도전하고 싶습니다.</p>')+
D('참고 자료','<p>알라딘, 2020, 음절 끝소리 규칙 및 연음과 절음<br>증약아(성균관대), 2022, 중국 광동어와 한국어의 종성 발음 대조 연구<br>최세화, 2023, 받침, 한국민족문화대백과사전<br>도서 ‘장국영의 언어’<br>粤语西多士朗读版, 小红书</p>')}
function quiz(){if(qi>=5)return '<h2>결과: '+sc+' / 5</h2><div class="card">'+(sc==5?'완벽해요! 받침 규칙이 귀에 들어오기 시작했어요.':'받침 대응표를 다시 보고 도전해 보세요.')+'</div><button class="btn prim" onclick="qi=0;sc=0;pk=-1;render()">다시 풀기</button>';
var q=qs[qi];return '<h2>미니 퀴즈 '+(qi+1)+' / 5</h2><div class="card"><p class="mut">광둥어 발음을 보고 한국어 한자음을 고르세요</p><div style="font-size:34px;font-weight:800">'+jh(q[0])+'</div><button class="sp" onclick="say(QH[qi])">🔊 발음 듣기</button></div>'+
q[2].map(function(o,i){var c=pk<0?'':(o==q[1]?'ok':(i==pk?'no':''));return '<button class="btn '+c+'" onclick="ans('+i+')">'+o+'</button>'}).join('')+
(pk>=0?'<button class="btn prim" onclick="qi++;pk=-1;render()">다음 →</button>':'')}
function ans(i){if(pk>=0)return;pk=i;if(qs[qi][2][i]==qs[qi][1])sc++;render()}
function render(){nav();var h='';
if(cur==0)h='<h1>광둥어를 몰라도 \'국, 삼, 육\'이 들린다고?</h1><div class="card"><p>영화 <b>중경삼림</b>의 유통기한 대사에는 日期(일기), 保鮮(보선), 過期(과기), 一萬年(일만년) 같은 말이 나옵니다. 한국어 한자음을 아는 사람이라면 광둥어 발음 속에서 익숙한 <b>받침</b>이 들립니다.</p><p>한국어의 ㄱ·ㄴ·ㅁ·ㅂ·ㅇ은 광둥어의 -k·-n·-m·-p·-ng와 대응하고, -t는 한자음에서 ㄹ로 바뀌었어요.</p></div>'+legend+
'<div class="card twist"><b>⚡ 반전:</b> 一은 jat1인데 한국어는 \'일\'. -t가 ㄹ로 변했습니다!</div>'+
'<h2>🔊 계속 듣기</h2><div class="card"><iframe src="https://www.youtube.com/embed/McR4ChikY2k" title="발음 영상" allowfullscreen></iframe><p class="mut">영상이 안 보이면 오른쪽 아래 \'발음 듣기\' 버튼을 누르세요. 어느 화면에서든 다시 들을 수 있습니다.</p></div>'+
'<button class="btn prim" onclick="go(1)">받침 대응표 보기 →</button>';
else if(cur==1)h='<h2>받침 대응표</h2><p class="mut">한국어 받침 7개 중 ㄹ을 제외한 6개가 광둥어 입성·비음 받침과 대응합니다.</p><div class="card scroll"><table><tr><th>한국어</th><th>광둥어</th><th>예시</th><th>보통화</th></tr>'+
[["ㄱ","k","k","國 국 gwok3","guó (소실)"],["ㄴ","n","n","山 산 saan1","shān (유지)"],["ㄷ*","t","t","一 일 jat1 (*ㄹ로 변함)","yī (소실)"],["ㅁ","m","m","三 삼 saam1","sān (-n으로 합류)"],["ㅂ","p","p","十 십 sap6","shí (소실)"],["ㅇ","ng","ng","東 동 dung1","dōng (유지)"]].map(function(r){return '<tr><td class="'+r[2]+'"><b>'+r[0]+'</b></td><td class="'+r[2]+'"><b>-'+r[1]+'</b></td><td>'+r[3]+'</td><td>'+r[4]+'</td></tr>'}).join('')+'</table></div>'+
'<div class="card mut">* ㄷ 받침은 소리로는 -t와 같지만, 한국 한자음에서 옛 -t는 대부분 ㄹ(일·월·팔)이 되었습니다. 보고서와 대조해 표현을 최종 확인하세요.</div><div class="card"><b>핵심:</b> 보통화는 -k·-t·-p 받침이 사라지고 -m은 -n으로 합쳐졌습니다. 그래서 한국어 한자음이 광둥어와 더 닮은 경우가 많습니다.</div>';
else if(cur==2)h='<h2>단어 사전</h2><p class="mut">카드를 누르면 펼쳐져요. 받침은 색으로 표시됩니다.</p>'+legend+W.map(function(w,i){return i<5?wcard(i):''}).join('')+'<h2 style="margin-top:18px">더 보기</h2>'+W.map(function(w,i){return i>=5?wcard(i):''}).join('');
else if(cur==3)h='<h2>대사 분석</h2><p class="mut">중경삼림 유통기한 대사를 한 줄씩 보며 광둥어 받침(-k -n -t -m -p -ng)을 색으로 표시했습니다. 줄 아래 칩은 그 줄의 받침 개수입니다.</p>'+legend+'<button class="btn" onclick="showKo=!showKo;render()">'+(showKo?'✅':'⬜')+' 한국 한자음 함께 보기 (구어 글자는 ·)</button>'+DL.map(function(l,n){var s=l[1].split(' '),cs={};var row=Array.from(l[0]).map(function(c,i){var a=cj(s[i])[1];if(a)cs[a]=(cs[a]||0)+1;var ko=KO[c]||'';return '<div class="sy" style="cursor:pointer" onclick="say(\''+c+'\')"><span class="mut">'+c+'</span><b>'+jh(s[i])+'</b>'+(showKo?'<b class="'+(ko?kc(ko):'')+'">'+(ko||'·')+'</b>':'')+'</div>'}).join('');return '<div class="card"><div class="mut">'+(n+1)+(n<4?' · 유통기한 독백 (통조림)':' · 유통기한 독백 (모든 것에 날짜가)')+'</div>'+row+'<p class="mut" style="margin:6px 0 0">'+DT[n][0]+'</p><p style="margin:2px 0 8px">'+DT[n][1]+'</p><button class="sp" onclick="say(DL['+n+'][0])">🔊 문장 듣기</button> <span class="mut">글자를 누르면 한 글자씩 들려요</span><div style="margin-top:8px">'+Object.keys(cs).map(function(a){return '<span class="chip '+a+'">-'+a+' ×'+cs[a]+'</span> '}).join('')+'</div></div>'}).join('');
else if(cur==4)h=quiz();else h=report();
document.getElementById('app').innerHTML=h}
var m=/^#s(\d)$/.exec(location.hash);if(m)cur=+m[1];render();
</script></body></html>
